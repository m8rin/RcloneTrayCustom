<!doctype html>
<html>

  <head>
    <script defer>
      $main.loadStyles()
      document.title = 'Добавить закладку'

      /**
       * Add available providers as options to select HTML element
       * @param {HTMLSelectElement} selectElement
       */
      window.renderAvailableProvidersSelectOptions = function (selectElement) {
        let optionsContainer = document.createDocumentFragment()
        let providers = window.$main.rclone.getProviders()
        let emptyOption = document.createElement('option')
        emptyOption.value = ''
        emptyOption.innerHTML = '&mdash; Выберите провайдер &mdash;'
        optionsContainer.appendChild(emptyOption)

        for (let providerName in providers) {
          if (providerName == 'webdav' || providerName == 'local') {
            let option = document.createElement('option')
            option.value = providerName

            if (providerName == 'local') {
              option.innerText = 'Локальный диск'
            } else {
              option.innerText = providers[providerName].Description
            }

            option.providerObject = providers[providerName]
            optionsContainer.appendChild(option)
          }
        }

        let range = document.createRange()
        range.selectNodeContents(selectElement)
        range.deleteContents()
        selectElement.appendChild(optionsContainer)
      }

      document.addEventListener('DOMContentLoaded', function () {
        function showError(error) {
          console.error('Error creating bookmark:', error)
          const message = error.message || 'Неизвестная ошибка при создании закладки'
          window.errorBox(message)
        }

        // Загружаем список провайдеров
        let providersList = document.getElementById('providers-list')
        let providers = $main.rclone.getProviders()
        Object.keys(providers).forEach(function (key) {
          let option = document.createElement('option')
          option.value = key
          option.textContent = key
          providersList.appendChild(option)
        })

        // Обработчик формы
        document.getElementById('the-form')
          .addEventListener('submit', async function (event) {
            event.preventDefault()
            let data = getTheFormData(this)
            console.log('Form data:', data)

            // Получаем значения формы
            const formValues = {
              ...data.options,
              _rclonetray_mount_drive: document.querySelector('select[name="_rclonetray_mount_drive"]').value
            }
            console.log('Submitting values:', formValues)

            try {
              await $main.rclone.addBookmark(data.type, data.name, formValues)
              window.close()
            } catch (error) {
              showError(error)
            }
          })

        // Обработчик изменения типа провайдера
        providersList.addEventListener('change', function () {
          let provider = providers[this.value]
          if (provider) {
            renderBookmarkSettings(
              document.getElementById('bookmark-settings'),
              this.value,
              { options: {} }
            )
          }
        })

        // Инициализация формы с первым провайдером
        if (providersList.options.length > 0) {
          providersList.dispatchEvent(new Event('change'))
        }
      });
    </script>
  </head>

  <body>

    <form id="the-form">

      <div class="row">
        <div class="cell-left">
          Тип подключения
        </div>
        <div class="cell-right">
          <select name="type" id="providers-list" style="width:20em;"></select>
        </div>
      </div>

      <div id="provider-settings-wrapper">

        <div class="row">
          <div class="cell-left">
            <label>
              Имя
            </label>
            <div class="label-required">
              обязательное
            </div>
          </div>
          <div class="cell-right">
            <input type="text" name="name" value="" maxlength="20" size="20" style="width:12em" />
          </div>
        </div>
        
        <div class="row">
          <div class="cell-left">
            <label>
              Буква диска
            </label>
            <div class="label-optional">
              необязательное
            </div>
          </div>
          <div class="cell-right">
            <select name="_rclonetray_mount_drive" style="width:12em">
              <option value="">Автоматически</option>
              <option value="E">E:</option>
              <option value="F">F:</option>
              <option value="G">G:</option>
              <option value="H">H:</option>
              <option value="I">I:</option>
              <option value="J">J:</option>
              <option value="K">K:</option>
              <option value="L">L:</option>
              <option value="M">M:</option>
              <option value="N">N:</option>
              <option value="O">O:</option>
              <option value="P">P:</option>
              <option value="Q">Q:</option>
              <option value="R">R:</option>
              <option value="S">S:</option>
              <option value="T">T:</option>
              <option value="U">U:</option>
              <option value="V">V:</option>
              <option value="W">W:</option>
              <option value="X">X:</option>
              <option value="Y">Y:</option>
              <option value="Z">Z:</option>
            </select>
          </div>
        </div>
        
        <div id="bookmark-settings"></div>

        <div class="row right buttons">
          <button type="submit">
            Добавить
          </button>
        </div>

      </div>

    </form>

  </body>

</html>
