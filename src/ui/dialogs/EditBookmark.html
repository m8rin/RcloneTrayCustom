<!DOCTYPE html>
<html>
  <head>
    <title>Редактировать закладку</title>
    <meta charset="UTF-8" />
    <script>
      window.$main.loadStyles();
      document.title = `Редактировать ${$main.getProps().$name}`;

      document.addEventListener("DOMContentLoaded", function () {
        const props = window.$main.getProps();
        document.getElementById("bookmarkName").textContent = props.$name;

        const form = document.getElementById("editForm");
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const formData = new FormData(form);
          try {
            await window.$main.rclone.updateBookmark(
              props.$name,
              Object.fromEntries(formData)
            );
            window.close();
          } catch (error) {
            alert(error.message);
          }
        });

        document
          .getElementById("delete-bookmark-button")
          .addEventListener("click", function (event) {
            event.preventDefault();
            if (confirm("Вы уверены, что хотите удалить закладку?")) {
              $main.rclone
                .deleteBookmark($main.getProps().$name)
                .then(window.close)
                .catch(window.errorBox);
            }
          });
      });
    </script>
  </head>

  <body>
    <h2>Редактировать закладку: <span id="bookmarkName"></span></h2>
    <form id="editForm">
      <div class="row">
        <div class="cell-left">Тип</div>
        <div class="cell-right">
          <var>
            <script>
              document.write($main.getProps().type);
            </script>
          </var>
        </div>
      </div>

      <div class="row">
        <div class="cell-left">Название</div>
        <div class="cell-right">
          <var>
            <script>
              document.write($main.getProps().$name);
            </script>
          </var>
        </div>
      </div>

      <div id="bookmark-settings"></div>

      <div class="row right buttons">
        <button id="delete-bookmark-button">Удалить</button>

        <button type="submit">Сохранить</button>
      </div>
    </form>
  </body>
</html>
